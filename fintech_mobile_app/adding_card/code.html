<style>

            background-color: #F8FAFC; /* Level 0 Background */

            background: linear-gradient(135deg, rgba(13, 28, 50, 0.9) 0%, rgba(13, 28, 50, 0.95) 100%);

<body class="font-body-lg text-on-surface antialiased bg-background min-h-screen pb-[100px] md:pb-0">
<!-- Header (Task-Focused, Nav suppressed as per rules for linear flows, but keeping brand anchor) -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-background flex justify-between items-center px-margin-mobile py-4 z-50">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:translate-y-px">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Add Card</h1>
</div>
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-stack-md">
<!-- Live Credit Card Mockup -->
<div class="glass-card rounded-xl p-6 text-on-secondary mb-stack-lg relative overflow-hidden h-[220px] flex flex-col justify-between" id="cardMockup">
<!-- decorative bg element -->
<div class="absolute -right-10 -top-10 w-40 h-40 bg-secondary-container rounded-full opacity-10 blur-2xl"></div>
<div class="absolute -left-10 -bottom-10 w-32 h-32 bg-[#00D4FF] rounded-full opacity-5 blur-2xl"></div>
<div class="flex justify-between items-start relative z-10">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">contactless</span>
<span class="font-headline-md text-headline-md tracking-widest text-[#00D4FF]">VISA</span>
</div>
<div class="relative z-10">
<div class="font-numeric-display text-numeric-display tracking-[0.15em] mb-2" id="displayCardNumber">**** **** **** ****</div>
<div class="flex justify-between items-end">
<div>
<div class="font-label-caps text-label-caps opacity-70 mb-1">CARDHOLDER</div>
<div class="font-headline-md text-headline-md uppercase truncate w-[180px]" id="displayCardName">JOHN DOE</div>
</div>
<div class="text-right">
<div class="font-label-caps text-label-caps opacity-70 mb-1">EXPIRES</div>
<div class="font-headline-md text-headline-md" id="displayExpiry">MM/YY</div>
</div>
</div>
</div>
</div>
<!-- Form Section -->
<form class="space-y-stack-md bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(10,25,47,0.04)] mb-stack-lg">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="cardNumber">Card Number</label>
<div class="relative">
<input class="input-field w-full font-body-lg text-body-lg text-on-surface pl-12" id="cardNumber" maxlength="19" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">credit_card</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="expiryDate">Expiry Date</label>
<input class="input-field w-full font-body-lg text-body-lg text-on-surface" id="expiryDate" maxlength="5" placeholder="MM/YY" type="text"/>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="cvv">CVV</label>
<div class="relative">
<input class="input-field w-full font-body-lg text-body-lg text-on-surface pr-12" id="cvv" maxlength="3" placeholder="123" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer text-sm">info</span>
</div>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="cardName">Cardholder Name</label>
<input class="input-field w-full font-body-lg text-body-lg text-on-surface" id="cardName" placeholder="Enter name on card" type="text"/>
</div>
<div class="flex items-center gap-2 pt-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm text-[#00677e]" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-body-sm text-body-sm text-outline">Your card details are protected by bank-grade encryption.</p>
</div>
</form>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant pb-safe pb-[max(env(safe-area-inset-bottom),20px)] z-40">
<button class="btn-primary w-full font-headline-md text-headline-md font-bold text-center" type="button">
                Add Card
            </button>
</div>
</main>
<script>
        // Simple script for live updating the card mockup
        document.addEventListener('DOMContentLoaded', () => {
            const cardNumberInput = document.getElementById('cardNumber');
            const expiryInput = document.getElementById('expiryDate');
            const nameInput = document.getElementById('cardName');
            
            const displayCardNumber = document.getElementById('displayCardNumber');
            const displayExpiry = document.getElementById('displayExpiry');
            const displayCardName = document.getElementById('displayCardName');

            // Format card number with spaces
            cardNumberInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                let formattedValue = '';
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 4 === 0) formattedValue += ' ';
                    formattedValue += value[i];
                }
                e.target.value = formattedValue;
                displayCardNumber.textContent = formattedValue || '**** **** **** ****';
            });

            // Format expiry date
            expiryInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2, 4);
                }
                e.target.value = value;
                displayExpiry.textContent = value || 'MM/YY';
            });

            // Update Name
            nameInput.addEventListener('input', (e) => {
                displayCardName.textContent = e.target.value || 'JOHN DOE';
            });
        });
    </script>
</body></html>
