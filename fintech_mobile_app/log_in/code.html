<!DOCTYPE html>

<html class="light" lang="en"><head>

                      "on-tertiary-container": "#818486",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed-variant": "#444749",
                      "on-secondary-fixed": "#001f27",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-container-lowest": "#ffffff",

                      "on-primary": "#ffffff",

              "spacing": {

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Nav Suppressed (Transactional Page) -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-surface-container-high/50 to-transparent pointer-events-none -z-10"></div>
<div class="absolute -top-32 -right-32 w-96 h-96 bg-secondary-fixed/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute -bottom-32 -left-32 w-80 h-80 bg-primary-fixed/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(10,25,47,0.04)] p-8 relative z-10">
<!-- Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container rounded-full mb-4">
<span class="material-symbols-outlined text-3xl text-secondary" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2 tracking-tight">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your Coinpay account.</p>
</div>
<!-- Form -->
<form class="space-y-stack-md">
<!-- Email Field -->
<div>
<label class="sr-only" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-[#F1F5F9] border-transparent rounded-[12px] font-body-lg text-on-surface placeholder:text-outline focus:border-[#00D4FF] focus:bg-surface-container-lowest focus:ring-0 transition-colors duration-200" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="sr-only" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-11 pr-11 py-4 bg-[#F1F5F9] border-transparent rounded-[12px] font-body-lg text-on-surface placeholder:text-outline focus:border-[#00D4FF] focus:bg-surface-container-lowest focus:ring-0 transition-colors duration-200" id="password" name="password" placeholder="Password" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button aria-label="Toggle password visibility" class="text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-[#00D4FF] focus:ring-[#00D4FF] focus:ring-offset-background bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-semibold text-secondary hover:text-on-secondary-container transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Actions -->
<div class="pt-stack-sm flex flex-col gap-4">
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-sm font-label-caps text-label-caps text-[#0A192F] bg-[#00D4FF] hover:bg-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#00D4FF] transition-all duration-200 active:translate-y-px active:shadow-none" type="submit">
                        Login
                    </button>
<button class="w-full flex items-center justify-center py-4 px-4 border-2 border-[#0A192F] rounded-xl font-label-caps text-label-caps text-[#0A192F] bg-transparent hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0A192F] transition-all duration-200 active:translate-y-px" type="button">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                        Biometric Login
                    </button>
</div>
</form>
<!-- Sign Up Prompt -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-semibold text-secondary hover:text-on-secondary-container transition-colors ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<script>
        // Simple password toggle logic for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
