<!DOCTYPE html>

<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

<body class="bg-background text-on-background h-full antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation (Transactional intent - minimal shell) -->
<header class="bg-surface dark:bg-on-background w-full top-0 sticky flex justify-between items-center px-margin-mobile py-4 z-50">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors active:translate-y-px transition-transform duration-100">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface dark:text-inverse-on-surface">Send Money</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="px-margin-mobile py-stack-md max-w-lg mx-auto pb-32">
<!-- Search Contacts -->
<div class="relative mb-stack-lg">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-[#F1F5F9] rounded-xl pl-12 pr-4 py-4 font-body-lg text-body-lg text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-secondary-container transition-all border-none" placeholder="Search name, phone, or email" type="text"/>
</div>
<!-- Recent Contacts -->
<section class="mb-stack-lg">
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm uppercase tracking-wider">Frequent Contacts</h2>
<div class="flex overflow-x-auto gap-gutter pb-4 -mx-margin-mobile px-margin-mobile snap-x scrollbar-hide">
<!-- Contact 1 (Selected/New) -->
<button class="snap-start flex flex-col items-center gap-2 min-w-[72px] group relative active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full bg-[#00D4FF] flex items-center justify-center text-[#0A192F] shadow-[0_4px_12px_rgba(0,212,255,0.3)] group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">add</span>
</div>
<span class="font-body-sm text-body-sm font-semibold text-on-surface truncate w-full text-center">New</span>
</button>
<!-- Contact 2 -->
<button class="snap-start flex flex-col items-center gap-2 min-w-[72px] group active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-transparent group-hover:border-secondary-container transition-all">
<img alt="Sarah J." class="w-full h-full object-cover" data-alt="A close-up, highly detailed portrait of a young professional woman in a brightly lit, modern office environment. High-key lighting emphasizing a clean, contemporary corporate fintech aesthetic with soft teal undertones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjbglqHoOxAmmsCxyQt9gskYSQkFefAeCBdzkjMQyK4YFIneMIG1_TLbAahbR-hHjFhOcrPEBB1JjoEzWWcozt7-EHo9DL2SOchvRnejA2egqXvE4d36zXRJXU1R9vuW6sWdpFboOs5pHoQ9G9sxcSos2td-lU_E-R9rsAy5CBmiryjjg00To_skFTrq-ef7dJJYo1O2Nin2jskFGVcVkZliyESQ6mMB4XdV9tIGstO4InNgmdRwfscg"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface truncate w-full text-center">Sarah J.</span>
</button>
<!-- Contact 3 -->
<button class="snap-start flex flex-col items-center gap-2 min-w-[72px] group active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-transparent group-hover:border-secondary-container transition-all">
<img alt="Michael T." class="w-full h-full object-cover" data-alt="A portrait of an older man with glasses in a minimalist, bright setting, conveying a sense of trust and established financial reliability. Shot in a high-key light mode style with subtle blue and grey color blocking in the background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAc1OLLLcXwzZN3IlbKvkNnUwtHx7Ust9R5NYJtfjR_aPq3HBsYn6FM7byBQCwKlEKaqWMrXVld5tiDcz4qIiyNQtMG0yS0a0rtSvoE2JyMjMjcpLo-MhEm0e3PGDO1ZMJDuJ0L1OzvyGssW-Ba_iblzb2gBYipnkrU64W_aMGtueh3bIVw_X9iUmMmd1xS7zcjidU1pEMVtOph2LfUKhKfeD5I1j7cNEk8WyGL4XnEqskm_5u5GCnYTQ"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface truncate w-full text-center">Michael T.</span>
</button>
<!-- Contact 4 -->
<button class="snap-start flex flex-col items-center gap-2 min-w-[72px] group active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-transparent group-hover:border-secondary-container transition-all bg-surface-variant flex items-center justify-center text-primary-container font-headline-md text-headline-md">
                        EL
                    </div>
<span class="font-body-sm text-body-sm text-on-surface truncate w-full text-center">Elena L.</span>
</button>
<!-- Contact 5 -->
<button class="snap-start flex flex-col items-center gap-2 min-w-[72px] group active:scale-95 transition-transform">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-transparent group-hover:border-secondary-container transition-all">
<img alt="David K." class="w-full h-full object-cover" data-alt="A cheerful young man in a casual yet polished setting, evoking a modern, friendly fintech user persona. The background is a crisp white with a very soft ambient glow, fitting a high-trust minimalist design system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEzYe1LaFqgjh6jShcS8Aqg8jDmxajvtS-5-T46n79AEGZvHB41ObN2u1gkv9JSIDm27O7Jq3uQemIuVFmeqwEq7KvWoGkOFdggiEaSDguF0K8u3PWiNc5XqVAgDbjB1Wck-4f49EIOjB0yA4URckNTSn1eUiXzsu_SUxGZHoiugmGH3Cgq0CiHrUGiSCVxbfTjxA7HXB3rihAlLf63Wuo3vSfxZhGVCO6wfmL3qks6F8EussbPfKo-w"/>
</div>
<span class="font-body-sm text-body-sm text-on-surface truncate w-full text-center">David K.</span>
</button>
</div>
</section>
<!-- Amount Input Card (Bento Style) -->
<section class="bg-[#FFFFFF] rounded-xl p-stack-md shadow-[0_4px_12px_rgba(10,25,47,0.04)] mb-stack-lg relative overflow-hidden">
<!-- Decorative gradient hint -->
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary-container/10 blur-2xl rounded-full -mr-10 -mt-10 pointer-events-none"></div>
<div class="flex justify-between items-center mb-stack-sm relative z-10">
<span class="font-label-caps text-label-caps text-outline uppercase">Amount</span>
<!-- Currency Selector -->
<button class="flex items-center gap-1 bg-surface-variant px-3 py-1 rounded-full active:scale-95 transition-transform">
<span class="font-body-sm text-body-sm font-semibold text-primary-container">USD</span>
<span class="material-symbols-outlined text-[16px] text-primary-container">expand_more</span>
</button>
</div>
<div class="flex items-baseline justify-center py-stack-md relative z-10">
<span class="font-headline-md text-headline-md text-on-surface mr-1">$</span>
<input class="font-numeric-display text-numeric-display text-on-surface bg-transparent border-none text-center focus:ring-0 w-full p-0 h-12 caret-secondary-container" placeholder="0.00" style="font-size: 48px; line-height: 56px;" type="number" value=""/>
</div>
<div class="text-center mt-2 relative z-10">
<p class="font-body-sm text-body-sm text-on-surface-variant">Balance: $4,250.00</p>
</div>
</section>
<!-- Transfer Options -->
<section class="flex flex-col gap-stack-sm mb-stack-lg">
<!-- Send to Contact -->
<div class="flex items-center p-4 bg-[#FFFFFF] rounded-xl shadow-[0_4px_12px_rgba(10,25,47,0.04)] border border-transparent cursor-pointer active:scale-[0.98] transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center mr-4 text-primary-container">
<span class="material-symbols-outlined" data-weight="fill">account_balance_wallet</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Send to Contact</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Instant internal transfer</p>
</div>
<span class="material-symbols-outlined text-secondary-container">check_circle</span>
</div>
<!-- Transfer to Bank -->
<div class="flex items-center p-4 bg-[#FFFFFF] rounded-xl shadow-[0_4px_12px_rgba(10,25,47,0.04)] border border-outline-variant/30 cursor-pointer opacity-70 hover:opacity-100 transition-opacity active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center mr-4 text-outline">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-semibold text-on-surface">Transfer to Bank</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">1-3 business days</p>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</div>
</section>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-[#FFFFFF]/90 backdrop-blur-xl border-t border-outline-variant/20 px-margin-mobile py-4 pb-8 z-50 shadow-[0_-4px_24px_rgba(10,25,47,0.08)]">
<div class="max-w-lg mx-auto flex gap-4">
<button class="flex-1 py-4 px-6 rounded-xl border-2 border-[#0A192F] text-[#0A192F] font-headline-md text-headline-md text-[16px] active:scale-95 active:translate-y-px transition-all duration-200">
                Cancel
            </button>
<button class="flex-[2] py-4 px-6 rounded-xl bg-[#00D4FF] text-[#0A192F] font-headline-md text-headline-md text-[16px] shadow-[0_4px_12px_rgba(0,212,255,0.3)] active:shadow-none active:scale-95 active:translate-y-px transition-all duration-200 flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
