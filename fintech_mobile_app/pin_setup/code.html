                }
            }
        }

<style>
        .pin-dot {
            transition: all 0.2s ease-in-out;
        }
        .pin-dot.filled {
            background-color: #00d2fd; /* secondary-container */
            border-color: #00d2fd;
            transform: scale(1.1);
        }
        .keypad-btn {
            transition: all 0.1s ease;
        }
        .keypad-btn:active {
            background-color: #eff4ff; /* surface-container-low */
            transform: translateY(2px);
            box-shadow: none !important;
        }
        
        /* Subtle animation for the shield icon */
        @keyframes pulse-shield {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .shield-icon {
            animation: pulse-shield 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-background h-full w-full flex flex-col font-sans text-on-surface antialiased overflow-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation (Transactional/Task Focused - Minimal) -->
<header class="w-full flex justify-between items-center px-margin-mobile py-4 sticky top-0 bg-background z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:translate-y-px">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-on-surface">Coinpay</div>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-between px-margin-mobile pb-stack-lg relative w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mt-8 z-10">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-stack-md relative">
<div class="absolute inset-0 rounded-full border-2 border-secondary-container/30 shield-icon"></div>
<span class="material-symbols-outlined text-secondary-container text-[32px] shield-icon" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm" id="pin-title">Set your security PIN</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]" id="pin-subtitle">Create a 4-digit PIN to secure your account and authorize transactions.</p>
</div>
<!-- PIN Indicators -->
<div class="flex justify-center items-center gap-6 my-12 z-10 h-12">
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent pin-dot" id="dot-1"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent pin-dot" id="dot-2"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent pin-dot" id="dot-3"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline-variant bg-transparent pin-dot" id="dot-4"></div>
</div>
<!-- Keypad -->
<div class="grid grid-cols-3 gap-x-gutter gap-y-stack-md w-full max-w-[320px] mx-auto z-10 mb-8">
<!-- Row 1 -->
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('1')">
<span class="font-numeric-display text-numeric-display text-on-surface">1</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('2')">
<span class="font-numeric-display text-numeric-display text-on-surface">2</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('3')">
<span class="font-numeric-display text-numeric-display text-on-surface">3</span>
</button>
<!-- Row 2 -->
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('4')">
<span class="font-numeric-display text-numeric-display text-on-surface">4</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('5')">
<span class="font-numeric-display text-numeric-display text-on-surface">5</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('6')">
<span class="font-numeric-display text-numeric-display text-on-surface">6</span>
</button>
<!-- Row 3 -->
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('7')">
<span class="font-numeric-display text-numeric-display text-on-surface">7</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('8')">
<span class="font-numeric-display text-numeric-display text-on-surface">8</span>
</button>
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('9')">
<span class="font-numeric-display text-numeric-display text-on-surface">9</span>
</button>
<!-- Row 4 -->
<div class="h-16"></div> <!-- Empty spacer -->
<button class="keypad-btn h-16 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-center justify-center shadow-[0_2px_8px_rgba(10,25,47,0.02)]" onclick="enterDigit('0')">
<span class="font-numeric-display text-numeric-display text-on-surface">0</span>
</button>
<button aria-label="Delete" class="keypad-btn h-16 rounded-2xl flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" onclick="deleteDigit()">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
</main>
<!-- Subtle Background Elements for 'High Security / Institutional' feel -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-40">
<!-- Abstract gradient mesh -->
<div class="absolute -top-[20%] -right-[10%] w-[70%] h-[50%] rounded-full bg-surface-container-highest blur-[100px]"></div>
<div class="absolute top-[40%] -left-[20%] w-[60%] h-[40%] rounded-full bg-surface-container blur-[100px]"></div>
</div>
<script>
        let currentPin = '';
        const maxDigits = 4;
        let step = 'setup'; // 'setup' or 'confirm'
        let firstPin = '';

        function updateDots() {
            for (let i = 1; i <= maxDigits; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function enterDigit(digit) {
            if (currentPin.length < maxDigits) {
                currentPin += digit;
                updateDots();

                if (currentPin.length === maxDigits) {
                    // Small delay to allow user to see the last dot fill
                    setTimeout(() => {
                        handleCompleteEntry();
                    }, 300);
                }
            }
        }

        function deleteDigit() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function handleCompleteEntry() {
            if (step === 'setup') {
                firstPin = currentPin;
                currentPin = '';
                step = 'confirm';
                
                // Animate transition to confirm step
                const title = document.getElementById('pin-title');
                const subtitle = document.getElementById('pin-subtitle');
                
                title.style.opacity = '0';
                subtitle.style.opacity = '0';
                
                setTimeout(() => {
                    title.textContent = 'Confirm PIN';
                    subtitle.textContent = 'Enter your 4-digit PIN again to confirm.';
                    title.style.opacity = '1';
                    subtitle.style.opacity = '1';
                    title.style.transition = 'opacity 0.3s ease';
                    subtitle.style.transition = 'opacity 0.3s ease';
                    updateDots(); // Clear dots visually
                }, 300);
                
            } else if (step === 'confirm') {
                if (currentPin === firstPin) {
                    // Success logic here
                    const dotsContainer = document.querySelector('.flex.justify-center.gap-6');
                    dotsContainer.innerHTML = '<div class="flex items-center justify-center text-secondary-container font-headline-md"><span class="material-symbols-outlined mr-2">check_circle</span> PIN Set Successfully</div>';
                    // Optional: redirect or close screen
                } else {
                    // Error logic
                    const dots = document.querySelectorAll('.pin-dot');
                    dots.forEach(dot => {
                        dot.classList.remove('filled');
                        dot.style.borderColor = '#ba1a1a'; // error color
                        
                        // Shake animation
                        dot.animate([
                            { transform: 'translateX(0)' },
                            { transform: 'translateX(-5px)' },
                            { transform: 'translateX(5px)' },
                            { transform: 'translateX(-5px)' },
                            { transform: 'translateX(5px)' },
                            { transform: 'translateX(0)' }
                        ], { duration: 400, iterations: 1 });
                    });
                    
                    setTimeout(() => {
                        currentPin = '';
                        dots.forEach(dot => {
                            dot.style.borderColor = ''; // reset border
                        });
                        updateDots();
                        
                        const subtitle = document.getElementById('pin-subtitle');
                        subtitle.textContent = 'PINs do not match. Please try again.';
                        subtitle.classList.add('text-error');
                        subtitle.classList.remove('text-on-surface-variant');
                        
                    }, 1000);
                }
            }
        }
    </script>
</body></html>
