<script>
        // Simple micro-interaction for illustration on load
        document.addEventListener('DOMContentLoaded', () => {
            const illustration = document.querySelector('img[data-alt]');
            if (illustration) {
                illustration.style.transform = 'translateY(10px)';
                illustration.style.opacity = '0';
                illustration.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                
                setTimeout(() => {
                    illustration.style.transform = 'translateY(0)';
                    illustration.style.opacity = '1';
                }, 100);
            }
        });
