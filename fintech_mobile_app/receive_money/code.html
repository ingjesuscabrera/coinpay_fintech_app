<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Receive Money</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">help_outline</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center px-margin-mobile pt-stack-lg pb-32">

<div class="flex flex-col items-center gap-2 mb-2">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-surface-variant">

</div>
<!-- The QR Code -->

<div class="w-full h-1 bg-secondary-container/50 absolute top-0 shadow-[0_0_8px_#00d2fd] animate-[scan_2s_ease-in-out_infinite_alternate]"></div>
</div>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mt-2">
                Scan to pay me

<div class="flex items-center gap-2 w-full">
<div class="flex-1 bg-surface-container-low rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface flex items-center truncate">
                    coinpay.me/alexmercer
                </div>
<button class="h-12 w-12 flex-shrink-0 bg-surface-container-low rounded-lg flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors active:translate-y-px">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>

<button class="flex-1 h-14 rounded-xl border-2 border-on-background text-on-background font-headline-md text-headline-md flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors active:translate-y-px">

            </button>

<span class="material-symbols-outlined" data-icon="share">share</span>

            </button>

<style>
        @keyframes scan {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(240px); opacity: 0; } /* Adjust 240px based on actual QR size if needed */
        }
