<div class="inline-flex items-center gap-2 bg-secondary-container/10 px-3 py-1 rounded-full mt-2">
<span class="material-symbols-outlined text-[16px] text-secondary-container" data-icon="check_circle" data-weight="fill">check_circle</span>
<span class="font-label-caps text-label-caps text-secondary-container">Completed</span>
</div>
</section>
<!-- Bento Grid Details -->

<!-- Date & Time -->
<div class="col-span-1 bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_12px_rgba(10,25,47,0.04)] border border-surface-container-low flex flex-col justify-between">

</div>

</div>

<span class="material-symbols-outlined" data-icon="download">download</span>

            </button>
</section>
<div class="text-center mt-2">
