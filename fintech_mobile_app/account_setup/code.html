<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC; /* Level 0 Background */
        }
        /* Custom Input Styles based on guidelines */
        .coinpay-input {
            background-color: #F1F5F9;
            border-radius: 12px;
            padding: 0 16px;
            border: 2px solid transparent;
            transition: border-color 0.2s ease;
            height: 56px; /* standard touch target */
        }
        .coinpay-input:focus {
            outline: none;
            border-color: #00D4FF;
            box-shadow: none;
        }
        /* Primary Button */
        .btn-primary {
            background-color: #00D4FF;
            color: #0A192F;
            padding: 16px;
            border-radius: 0.75rem; /* rounded-xl */
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0px 4px 12px rgba(10, 25, 47, 0.08); /* slight shadow initially */
        }
        .btn-primary:active {
            box-shadow: none;
            transform: translateY(1px);
        }
        
        /* Secondary Button */
        .btn-secondary {
            background-color: transparent;
            color: #0A192F;
            border: 2px solid #0A192F;
            padding: 14px 16px; /* account for border */
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-secondary:active {
            transform: translateY(1px);
        }

        /* Glass Card for Form */
        .glass-card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 24px 16px;
            box-shadow: 0px 4px 12px rgba(10, 25, 47, 0.04); /* Level 1 shadow */
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- TopAppBar (Transactional - simplified shell) -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-margin-mobile py-4 z-10 flat no shadows">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:translate-y-px" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-on-surface">Coinpay</div>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow w-full max-w-[480px] px-margin-mobile flex flex-col mt-stack-md pb-32">
<!-- Progress Indicator -->
<div class="w-full flex items-center justify-between mb-stack-lg">
<div class="flex space-x-2 w-full pr-4">
<div class="h-1.5 flex-1 bg-secondary-container rounded-full"></div>
<div class="h-1.5 flex-1 bg-secondary-container rounded-full"></div>
<div class="h-1.5 flex-1 bg-outline-variant/30 rounded-full"></div>
<div class="h-1.5 flex-1 bg-outline-variant/30 rounded-full"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant whitespace-nowrap">STEP 2 OF 4</span>
</div>
<!-- Page Header -->
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm">Personal Details</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">We need a few more details to verify your identity and secure your account.</p>
</div>
<!-- Form Card -->
<div class="glass-card flex flex-col space-y-stack-md w-full">
<!-- Date of Birth -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="dob">Date of Birth</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10">calendar_month</span>
<input class="coinpay-input w-full pl-12 font-body-lg text-body-lg text-on-surface" id="dob" name="dob" required="" type="date"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-10">call</span>
<input class="coinpay-input w-full pl-12 font-body-lg text-body-lg text-on-surface" id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Address -->
<div class="flex flex-col pt-stack-sm">
<h3 class="font-headline-md text-headline-md text-on-background mb-stack-sm border-b border-outline-variant/20 pb-2">Home Address</h3>
<div class="space-y-stack-md mt-2">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="address1">Street Address</label>
<input class="coinpay-input w-full font-body-lg text-body-lg text-on-surface" id="address1" name="address1" placeholder="123 Financial Ave" required="" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="address2">Apt, Suite, etc. (Optional)</label>
<input class="coinpay-input w-full font-body-lg text-body-lg text-on-surface" id="address2" name="address2" placeholder="Suite 400" type="text"/>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="city">City</label>
<input class="coinpay-input w-full font-body-lg text-body-lg text-on-surface" id="city" name="city" placeholder="New York" required="" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface mb-base ml-1" for="zip">Zip Code</label>
<input class="coinpay-input w-full font-body-lg text-body-lg text-on-surface" id="zip" name="zip" placeholder="10001" required="" type="text"/>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Actions - Transactional safe area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant/20 p-container-padding pb-[calc(16px+env(safe-area-inset-bottom,16px))] flex justify-center z-50">
<div class="w-full max-w-[480px]">
<button class="btn-primary w-full flex justify-center items-center font-headline-md text-headline-md" type="button">
                Continue
                <span class="material-symbols-outlined ml-2 text-xl">arrow_forward</span>
</button>
<div class="mt-4 text-center">
<span class="material-symbols-outlined text-outline align-middle text-sm mr-1">lock</span>
<span class="font-label-caps text-label-caps text-outline align-middle">SECURE 256-BIT ENCRYPTION</span>
</div>
</div>
</div>
</body></html>
