<style>
        .loading-bar-container {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background-color: #00D4FF; /* Electric Teal Accent */
            border-radius: 9999px;
            width: 0%;
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 50%; transform: translateX(50%); }
            100% { width: 100%; transform: translateX(200%); }
        }

        .pulse-logo {
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-primary-container h-screen w-screen flex flex-col items-center justify-center m-0 overflow-hidden relative">
<!-- Ambient background glows -->
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-primary/30 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Content -->
<div class="flex flex-col items-center justify-center flex-1 z-10">
<!-- Logo & Brand -->
<div class="flex flex-col items-center pulse-logo mb-12">
<!-- Icon/Mark -->
<div class="w-24 h-24 bg-surface rounded-3xl flex items-center justify-center shadow-[0_8px_24px_rgba(0,0,0,0.4)] mb-stack-md">
<span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                    account_balance_wallet
                </span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg text-on-primary">Coinpay</h1>
<p class="font-body-sm text-body-sm text-primary-fixed-dim mt-stack-sm tracking-wide opacity-80">Secure. Fast. Global.</p>
</div>
</div>
<!-- Bottom Loading Indicator -->
<div class="absolute bottom-margin-mobile left-0 w-full flex flex-col items-center justify-center pb-8 z-10">
<div class="loading-bar-container shadow-[0_4px_12px_rgba(0,212,255,0.2)]">
<div class="loading-bar"></div>
</div>
<span class="font-label-caps text-label-caps text-primary-fixed-dim mt-4 opacity-50 uppercase tracking-widest">Initializing Secure Connection</span>
</div>
