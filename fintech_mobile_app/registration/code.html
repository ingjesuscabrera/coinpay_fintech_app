        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background w-full top-0 sticky z-40 flat no shadows flex justify-between items-center px-margin-mobile py-4 w-full">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md font-bold text-on-surface dark:text-inverse-on-surface">Coinpay</span>
</div>
<div class="flex items-center">
<!-- Trailing action hidden for registration intent, but keeping structure -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile py-8 md:max-w-md md:mx-auto md:w-full">
<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join Coinpay to manage your digital assets securely.</p>
</div>
<form action="#" class="flex flex-col gap-stack-md w-full" method="POST">
<!-- Full Name Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fullName">Full Name</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-low text-on-background font-body-lg text-body-lg rounded-lg py-4 pl-12 pr-4 border border-transparent focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low text-on-background font-body-lg text-body-lg rounded-lg py-4 pl-12 pr-4 border border-transparent focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low text-on-background font-body-lg text-body-lg rounded-lg py-4 pl-12 pr-12 border border-transparent focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-colors outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-outline mt-1 text-xs">Must be at least 8 characters long.</p>
</div>
<!-- Sign Up Button -->
<button class="mt-stack-sm w-full bg-secondary-container text-on-background font-body-lg text-body-lg font-bold py-4 rounded-xl shadow-[0_4px_12px_rgba(10,25,47,0.04)] active:shadow-none active:translate-y-px transition-all duration-200" type="submit">
                Sign Up
            </button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-body-sm text-body-sm text-outline-variant">or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-gutter mb-stack-lg">
<button class="flex items-center justify-center gap-2 bg-surface-container-low border border-outline-variant rounded-xl py-3 hover:bg-surface-variant transition-colors active:translate-y-px">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1l0arwwMlMpL9REznf5niOXsIAwrkL0j7nmykZvHUpHDN2zuq-_Sz1s_yZYMAMizMjOQ27coq36ZqqM5-lrHhODlx1LhEsjUMlesHz-ZWnEP0UIjX-PyVmZVa5i1rbTBaQEcG7i45K82SS-r7VZ7Sj5rF0CEPACEsvWK_jpljCBq4ULOlhBIRbSu_kDUKhsYC3y1s5g1yqBArCNKXLR7UZWj0Lfh_gs2vu_iAWusX8nb0s2yFKuePiw"/>
<span class="font-body-sm text-body-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-low border border-outline-variant rounded-xl py-3 hover:bg-surface-variant transition-colors active:translate-y-px">
<img alt="Apple Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjHfr6Kvi3NlOodNjN-aRYPbUR1AVF-uOddYbJ-8mNk4ZmFqeGcTslxmB4p70QskORkYe-t4rofCrMuc56qiTV2d1NioryxnAsXyYWbH1l6CJylCH1aq_jY-2fJvkWBYhxZKu9DK_8n3k8iG7mXpWbx7djZiRJCfdI4Zssp4wXPW-_BP3l_YMZ4NuXHXgmCAKdSnyb96X1BnwQ6UpCEK1rd_cRbYkfW9gUBJ0y_sRhdRFGscPH8AolYQ"/>
<span class="font-body-sm text-body-sm font-semibold">Apple</span>
</button>
</div>
<!-- Login Link -->
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-auto">
            Already have an account? 
            <a class="text-secondary font-semibold hover:underline" href="#">Log in</a>
</p>
</main>
<!-- BottomNavBar Suppressed: Transactional/Linear Intent (Sign-up screen) -->
</body></html>
